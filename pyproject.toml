[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-guardian-ubuntu"
version = "2.4.9"
description = "Read-only Ubuntu desktop diagnostics, freeze evidence and Zabbix 7 monitoring."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "psutil>=7.0,<8",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3"
]

[project.optional-dependencies]
web = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "Jinja2>=3.1,<4"
]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1"
]

[tool.setuptools.packages.find]
include = ["core*", "monitors*", "diagnostics*", "integrations*", "web*", "zabbix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
